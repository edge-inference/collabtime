    - "cache_entries_timeline"
    - "jam_entries_timeline"
    - "num_jammed_nodes_timeline"
    - "jam_intensity_avg_timeline"
    - "utilization_working_timeline"
    - "utilization_active_timeline"
    - "num_stuck_agents_timeline"
    - "avg_stuck_counter_timeline"
    - "max_stuck_counter_timeline"
    - "stalls_in_transit_timeline"
    - "stalls_at_resource_timeline"
    - "stalls_idle_timeline"

output:
