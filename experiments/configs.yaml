# Warehouse P2P Coordination Experiment Configurations
# Experiments for testing peer-to-peer distributed coordination system

experiments:
  baseline_10_agents:
    name: "Baseline: 10 Agents"
    description: "Baseline with 10 agents for validation"
    warehouse:
      size: [20, 15]
      storage_regions:
        - {center: [5, 4], radius: 3}
        - {center: [15, 11], radius: 3}
      sortation_regions:
        - {center: [10, 2], radius: 1}
        - {center: [10, 13], radius: 1}
    agents:
      count: 10
      initial_positions: "random"
    coordination:
      gossip_interval: 3
      aoi_threshold: 1000
      lease_ttl: 30000
    tasks:
      arrival_rate: 0.10
      types: ["pickup", "delivery", "sort"]
      priorities: [1, 1, 1]
    simulation:
      duration: 300
      step_interval: 50
      mode: p2p
      seed: 42

  scalability_20_agents:
    name: "Scalability: 20 Agents"
