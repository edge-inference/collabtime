metrics:
  performance:
    - "tasks_completed"
    - "tasks_failed"
    - "average_completion_time"
    - "agent_utilization"
    - "total_distance_traveled"
    - "throughput_tps"
  coordination:
    - "avg_cache_size"
    - "total_gossip_rounds"
    - "tasks_in_registry"
    - "active_leases"
  time_series:
