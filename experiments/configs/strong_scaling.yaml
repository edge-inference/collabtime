# Strong Scaling Study
# Fixed warehouse: 120 x 100 (12,000 cells)
# Fixed arrival rate: λ = 5.0 tasks/s
# Only varies: N (number of robots)
# Measures: How does adding robots improve performance for fixed demand in fixed space?

experiments:
  strong_dist_50:
    name: "Strong Scaling P2P: 50 Robots"
    warehouse:
      size: [120, 100]
      storage_regions:
        - {center: [30, 25], radius: 20}
        - {center: [90, 75], radius: 20}
      sortation_regions:
        - {center: [60, 13], radius: 10}
        - {center: [60, 87], radius: 10}
    agents: {count: 50, initial_positions: "random"}
    coordination: {gossip_interval: 4, aoi_threshold: 1000, lease_ttl: 30000}
    tasks: {arrival_rate: 5.0, types: ["pickup", "delivery", "sort"], priorities: [1, 1, 1]}
    simulation: {duration: 900, step_interval: 100, mode: p2p, seed: 42, use_spatial_hash: true, parallel_gossip: true, gossip_workers: 6, use_cython: true}

  strong_cent_50:
