# Large Scale Experiments (600-1000 agents)
# Finding the crossover point where distributed overtakes centralized

experiments:
  scalability_600_agents:
    name: "Scalability: 600 Agents"
    description: "Large scale test with 600 agents to test coordination overhead"
    warehouse:
      size: [105, 85]
      storage_regions:
        - {center: [26, 21], radius: 17}
        - {center: [79, 64], radius: 17}
      sortation_regions:
        - {center: [52, 11], radius: 8}
        - {center: [52, 74], radius: 8}
    agents:
      count: 600
      initial_positions: "random"
    coordination:
      gossip_interval: 4
      aoi_threshold: 1000
      lease_ttl: 30000
    tasks:
      arrival_rate: 5.5
      types: ["pickup", "delivery", "sort"]
      priorities: [1, 1, 1]
    simulation:
      duration: 300
      step_interval: 100
      mode: p2p
      seed: 42
      use_spatial_hash: true
      parallel_gossip: true
      gossip_workers: 8
      parallel_agents: true
      agent_workers: 16
      use_cython: true

  centralized_600_agents:
    name: "Centralized: 600 Agents"
