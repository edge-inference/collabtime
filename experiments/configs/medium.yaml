# Medium Scale Experiments (200-500 agents)
# Testing coordination overhead vs centralized bottleneck

experiments:
  scalability_200_agents:
    name: "Scalability: 200 Agents (Optimized)"
    description: "Medium scale test with 200 agents + all optimizations"
    warehouse:
      size: [70, 55]
      storage_regions:
        - {center: [18, 14], radius: 11}
        - {center: [52, 41], radius: 11}
      sortation_regions:
        - {center: [35, 7], radius: 5}
        - {center: [35, 48], radius: 5}
    agents:
      count: 200
      initial_positions: "random"
    coordination:
      gossip_interval: 3
      aoi_threshold: 1000
      lease_ttl: 30000
    tasks:
      arrival_rate: 3.0
      types: ["pickup", "delivery", "sort"]
      priorities: [1, 1, 1]
    simulation:
      duration: 900
      step_interval: 100
      mode: p2p
      seed: 42
      use_spatial_hash: true
      parallel_gossip: true
      gossip_workers: 14
      use_cython: true

  centralized_200_agents:
    name: "Centralized: 200 Agents (Optimized)"
    description: "Centralized baseline with 200 agents + Cython A*"
    warehouse:
