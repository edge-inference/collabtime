# Weak Scaling Study
# Fixed λ/N = 0.015 tasks/robot/s for all robot counts
# Measures: Does per-robot efficiency stay constant as we scale?

experiments:
  weak_dist_50:
    name: "Weak Scaling P2P: 50 Robots"
    warehouse:
      size: [40, 30]
      storage_regions:
        - {center: [10, 8], radius: 6}
        - {center: [30, 22], radius: 6}
      sortation_regions:
        - {center: [20, 5], radius: 3}
        - {center: [20, 25], radius: 3}
    agents: {count: 50, initial_positions: "random"}
    coordination: {gossip_interval: 3, aoi_threshold: 1000, lease_ttl: 30000}
    tasks: {arrival_rate: 0.75, types: ["pickup", "delivery", "sort"], priorities: [1, 1, 1]}
    simulation: {duration: 900, step_interval: 100, mode: p2p, seed: 42, use_spatial_hash: true, parallel_gossip: true, gossip_workers: 6, use_cython: true}

  weak_cent_50:
    name: "Weak Scaling Centralized: 50 Robots"
    warehouse:
      size: [40, 30]
