        - {center: [20, 25], radius: 3}
    agents: {count: 50, initial_positions: "random"}
    coordination: {gossip_interval: 3, aoi_threshold: 1000, lease_ttl: 30000}
    tasks: {arrival_rate: 0.75, types: ["pickup", "delivery", "sort"], priorities: [1, 1, 1]}
    simulation: {duration: 900, step_interval: 100, mode: centralized, centralized_replicas: 10, seed: 42, use_cython: true}

