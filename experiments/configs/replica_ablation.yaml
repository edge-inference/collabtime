  replica_cent_100_r10:
    name: "Centralized 10 Replicas: 100 Robots"
    warehouse: *warehouse_fixed
    agents: {count: 100, initial_positions: "random"}
    coordination: {gossip_interval: 4, aoi_threshold: 1000, lease_ttl: 30000}
    tasks: *tasks_fixed
    simulation: {duration: 900, step_interval: 100, mode: centralized, centralized_replicas: 10, seed: 42, use_cython: true}

  replica_cent_100_r25:
    name: "Centralized 25 Replicas: 100 Robots"
    warehouse: *warehouse_fixed
    agents: {count: 100, initial_positions: "random"}
    coordination: {gossip_interval: 4, aoi_threshold: 1000, lease_ttl: 30000}
    tasks: *tasks_fixed
    simulation: {duration: 900, step_interval: 100, mode: centralized, centralized_replicas: 25, seed: 42, use_cython: true}

  replica_cent_100_r50:
    name: "Centralized 50 Replicas: 100 Robots"
    warehouse: *warehouse_fixed
    agents: {count: 100, initial_positions: "random"}
    coordination: {gossip_interval: 4, aoi_threshold: 1000, lease_ttl: 30000}
