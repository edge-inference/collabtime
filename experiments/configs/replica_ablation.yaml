# Replica Ablation Study
# Fixed warehouse: 120 x 100, Fixed λ = 5.0 tasks/s
# Tests: How many centralized replicas are needed at different fleet sizes?
# Includes P2P baseline for comparison

experiments:
  # === 100 ROBOTS ===
  replica_p2p_100:
    name: "P2P Baseline: 100 Robots"
    warehouse: &warehouse_fixed
      size: [120, 100]
      storage_regions:
        - {center: [30, 25], radius: 20}
        - {center: [90, 75], radius: 20}
      sortation_regions:
        - {center: [60, 13], radius: 10}
        - {center: [60, 87], radius: 10}
    agents: {count: 100, initial_positions: "random"}
    coordination: {gossip_interval: 4, aoi_threshold: 1000, lease_ttl: 30000}
    tasks: &tasks_fixed {arrival_rate: 5.0, types: ["pickup", "delivery", "sort"], priorities: [1, 1, 1]}
    simulation: {duration: 900, step_interval: 100, mode: p2p, seed: 42, use_spatial_hash: true, parallel_gossip: true, gossip_workers: 12, use_cython: true}

  replica_cent_100_r1:
    name: "Centralized 1 Replica: 100 Robots"
    warehouse: *warehouse_fixed
    agents: {count: 100, initial_positions: "random"}
    coordination: {gossip_interval: 4, aoi_threshold: 1000, lease_ttl: 30000}
    tasks: *tasks_fixed
    simulation: {duration: 900, step_interval: 100, mode: centralized, centralized_replicas: 1, seed: 42, use_cython: true}

  replica_cent_100_r5:
    name: "Centralized 5 Replicas: 100 Robots"
    warehouse: *warehouse_fixed
    agents: {count: 100, initial_positions: "random"}
